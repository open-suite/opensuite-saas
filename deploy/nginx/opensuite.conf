# Open Suite — one origin for everything.
#
# Certificates are looked up per TLS handshake by server name, so the primary
# domain and every customer domain share this one server block and a new
# custom domain needs no reload: the app writes <name>.crt/.key and it works.

map $http_upgrade $os_connection {
    default upgrade;
    ''      '';
}

upstream opensuite_app {
    server 127.0.0.1:8600;
    keepalive 64;
}

upstream opensuite_chat {
    server 127.0.0.1:8008;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    include /etc/nginx/opensuite-plain-*.conf;
    server_name _;

    location /.well-known/acme-challenge/ {
        proxy_pass http://opensuite_app;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    include /etc/nginx/opensuite-tls-*.conf;
    server_name _;

    ssl_certificate     /var/lib/opensuite/certs/$ssl_server_name.crt;
    ssl_certificate_key /var/lib/opensuite/certs/$ssl_server_name.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:opensuite:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 50m;
    root /opt/opensuite/web;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/css image/svg+xml application/wasm text/plain;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    # Fingerprinted build output: served from disk, cached for ever.
    location /assets/ {
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Live document sync and mail push: long-lived, unbuffered.
    location ~ ^/api/(docs/[^/]+/sync|mail/events)$ {
        proxy_pass http://opensuite_app;
        # proxy_set_header is all-or-nothing per level, so repeat the basics.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $os_connection;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Chat engine. Directory and admin surfaces stay closed: people are found
    # through their own organisation, never through a server-wide search.
    location ~ ^/_matrix/client/[^/]+/(user_directory|publicRooms|register|login) {
        return 403;
    }
    location /_matrix/ {
        proxy_pass http://opensuite_chat;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Video engine signalling.
    location /lk/ {
        proxy_pass http://127.0.0.1:7880/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $os_connection;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://opensuite_app;
    }
}
